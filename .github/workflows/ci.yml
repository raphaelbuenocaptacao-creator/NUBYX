name: NUBYX CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PWA
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Validate PWA manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const file = 'manifest.webmanifest';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const required = ['name', 'short_name', 'start_url', 'scope', 'display', 'icons'];

          for (const key of required) {
            if (!manifest[key] || (Array.isArray(manifest[key]) && manifest[key].length === 0)) {
              throw new Error(`manifest.webmanifest: missing required field ${key}`);
            }
          }

          if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) {
            throw new Error('manifest.webmanifest: at least one icon is required');
          }

          const referencedAssets = [];
          for (const icon of manifest.icons) {
            if (!icon.src) throw new Error('manifest.webmanifest: icon without src');
            referencedAssets.push(icon.src);
          }

          for (const shortcut of manifest.shortcuts || []) {
            if (!shortcut.name || !shortcut.url) {
              throw new Error('manifest.webmanifest: shortcut missing name or url');
            }
            for (const icon of shortcut.icons || []) {
              if (!icon.src) throw new Error(`manifest.webmanifest: shortcut ${shortcut.name} has icon without src`);
              referencedAssets.push(icon.src);
            }
          }

          for (const asset of referencedAssets) {
            if (/^(https?:|data:)/i.test(asset)) continue;
            const normalized = asset.replace(/^\.\//, '').split(/[?#]/)[0];
            const resolved = path.resolve(normalized);
            const root = path.resolve('.');
            if (resolved !== root && !resolved.startsWith(root + path.sep)) {
              throw new Error(`manifest.webmanifest: asset escapes repository root: ${asset}`);
            }
            if (!fs.existsSync(resolved) || !fs.statSync(resolved).isFile()) {
              throw new Error(`manifest.webmanifest: referenced asset not found: ${asset}`);
            }
          }

          console.log(`manifest.webmanifest: valid structure; ${referencedAssets.length} referenced assets verified`);
          NODE

      - name: Validate service worker precache integrity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const source = fs.readFileSync('sw.js', 'utf8');

          function readSet(name) {
            const match = source.match(new RegExp(`const\\s+${name}\\s*=\\s*new\\s+Set\\s*\\(\\s*\\[([\\s\\S]*?)\\]\\s*\\)`));
            if (!match) throw new Error(`sw.js: unable to locate ${name}`);

            const values = [];
            const literal = /(['"])(.*?)\1/g;
            let item;
            while ((item = literal.exec(match[1]))) values.push(item[2]);
            if (!values.length) throw new Error(`sw.js: ${name} is empty or not statically readable`);
            return values;
          }

          const staticAssets = readSet('STATIC_ASSETS');
          const requiredAssets = readSet('REQUIRED_SHELL_ASSETS');
          const staticSet = new Set(staticAssets);
          const root = path.resolve('.');

          for (const asset of requiredAssets) {
            if (!staticSet.has(asset)) {
              throw new Error(`sw.js: required shell asset is not in STATIC_ASSETS: ${asset}`);
            }
          }

          for (const asset of staticAssets) {
            if (asset === './') continue;
            if (!asset.startsWith('./')) {
              throw new Error(`sw.js: precache asset must be repository-relative: ${asset}`);
            }
            const normalized = asset.slice(2).split(/[?#]/)[0];
            const resolved = path.resolve(normalized);
            if (resolved !== root && !resolved.startsWith(root + path.sep)) {
              throw new Error(`sw.js: precache asset escapes repository root: ${asset}`);
            }
            if (!fs.existsSync(resolved) || !fs.statSync(resolved).isFile()) {
              throw new Error(`sw.js: precache asset not found: ${asset}`);
            }
          }

          console.log(`sw.js: ${staticAssets.length} precache assets verified; ${requiredAssets.length} required assets are covered`);
          NODE

      - name: Verify critical PWA shell files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html manifest.webmanifest sw.js app.js identity-runtime.js pwa-register.js pwa-update.js; do
            test -s "$file" || { echo "Missing or empty critical PWA file: $file"; exit 1; }
          done
