name: NUBYX CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PWA
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Validate PWA manifest
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('manifest.webmanifest: valid JSON')"

      - name: Verify critical PWA shell files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html manifest.webmanifest sw.js app.js identity-runtime.js pwa-register.js pwa-update.js; do
            test -s "$file" || { echo "Missing or empty critical PWA file: $file"; exit 1; }
          done
